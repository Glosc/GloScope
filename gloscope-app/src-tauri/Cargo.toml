[package]
name = "gloscope-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gloscope_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
toml = "0.9"

codex-app-server-client = { path = "../../codex-rs/app-server-client" }
codex-app-server-protocol = { path = "../../codex-rs/app-server-protocol" }
codex-arg0 = { path = "../../codex-rs/arg0" }
codex-cloud-config = { path = "../../codex-rs/cloud-config" }
codex-config = { path = "../../codex-rs/config" }
codex-core = { path = "../../codex-rs/core" }
codex-feedback = { path = "../../codex-rs/feedback" }
codex-gloscope-config = { path = "../../codex-rs/gloscope-config" }
codex-http-client = { path = "../../codex-rs/http-client" }
codex-keyring-store = { path = "../../codex-rs/keyring-store" }
codex-protocol = { path = "../../codex-rs/protocol" }
codex-utils-absolute-path = { path = "../../codex-rs/utils/absolute-path" }
futures = "0.3"
dirs = "6"
rama-error = "=0.3.0-alpha.4"
rama-utils = "=0.3.0-alpha.4"
winapi = { version = "0.3.9", features = ["std"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "f69a4a0499f2fdc7d5d222df32373ffffe9ba3f5" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

